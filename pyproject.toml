[tool.black]
line-length = 88
target-version = ["py310"]
include = '\.pyi?$'
exclude = '''
/(\
  \.git
  | \.venv
  | build
  | dist
) /
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["schwabgym"]
default_section = "THIRDPARTY"

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]

[tool.tox]
env_list = ["py310", "py311"]

[tool.tox.testenv]
description = "Run linters, pre-commit checks, and tests"
deps = ["pytest", "pre-commit"]
commands = [
  "pre-commit run --all-files",
  "pytest -q",
]
